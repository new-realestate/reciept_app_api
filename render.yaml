services:
  - type: web
    name: receipt-app
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    preDeployCommand: alembic upgrade head
    envVars:
      # Postgres and object storage live on Neon (project misty-dew-25464680, branch
      # production). Copy the values from `neon env pull` / the Neon console.
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_UNPOOLED
        sync: false
      - key: STORAGE_BACKEND
        value: s3
      - key: STORAGE_BUCKET
        value: uploads
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_ENDPOINT_URL_S3
        sync: false
      - key: AWS_REGION
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: APP_BASE_URL
        sync: false
      - key: CORS_ALLOW_ORIGINS_RAW
        sync: false
      - key: GMAIL_CLIENT_ID
        sync: false
      - key: GMAIL_CLIENT_SECRET
        sync: false
      - key: GMAIL_REFRESH_TOKEN
        sync: false
      - key: GMAIL_SENDER_EMAIL
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      # Reminders, schedule occurrences and quotation expiry run in-process; keep this
      # service at a single instance (it already is: one in-memory rate limiter).
      - key: SCHEDULER_ENABLED
        value: "true"
      - key: SEED_DEFAULT_USERS_ENABLED
        sync: false
      - key: SEED_DEFAULT_USERS
        sync: false
