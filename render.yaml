databases:
  - name: receipt-app-db
    plan: free
    postgresMajorVersion: "17"

services:
  - type: web
    name: receipt-app
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    preDeployCommand: alembic upgrade head
    disk:
      name: receipt-app-storage
      mountPath: /app/static
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: receipt-app-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: APP_BASE_URL
        sync: false
      - key: CORS_ALLOW_ORIGINS_RAW
        sync: false
      - key: STORAGE_DIR
        value: /app/static
      - key: GMAIL_CLIENT_ID
        sync: false
      - key: GMAIL_CLIENT_SECRET
        sync: false
      - key: GMAIL_REFRESH_TOKEN
        sync: false
      - key: GMAIL_SENDER_EMAIL
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      - key: SEED_DEFAULT_USERS_ENABLED
        sync: false
      - key: SEED_DEFAULT_USERS
        sync: false
